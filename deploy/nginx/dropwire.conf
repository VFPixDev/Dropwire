# Replace dropwire.example.com and certificate paths before enabling this file.

limit_req_zone $binary_remote_addr zone=dropwire_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=dropwire_connections:10m;

upstream dropwire_web {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name dropwire.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dropwire.example.com;

    ssl_certificate /etc/letsencrypt/live/dropwire.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dropwire.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DropwireTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    location = /health {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://dropwire_web/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location ^~ /download/ {
        access_log off;
        limit_req zone=dropwire_requests burst=20 nodelay;
        limit_conn dropwire_connections 8;

        proxy_pass http://dropwire_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Connection "";

        proxy_force_ranges on;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 10m;
        send_timeout 10m;
    }

    location / {
        return 404;
    }
}

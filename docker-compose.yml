services:
  dropwire-bot:
    image: ${DROPWIRE_IMAGE:-ghcr.io/vfpixdev/dropwire:latest}
    container_name: dropwire-bot
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    pids_limit: 256
    env_file:
      - path: .env
        required: false
    volumes:
      - data:/app/data
      - downloads:/app/downloads
    tmpfs:
      - /tmp:size=256m,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - dropwire-network

  dropwire-web:
    image: ${DROPWIRE_IMAGE:-ghcr.io/vfpixdev/dropwire:latest}
    container_name: dropwire-web
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    pids_limit: 128
    env_file:
      - path: .env
        required: false
    command: ["uvicorn", "src.web:app", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PUBLIC_PORT:-8080}:8080"
    volumes:
      - data:/app/data
      - downloads:/app/downloads
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - dropwire-network

volumes:
  data:
    driver: local
  downloads:
    driver: local

networks:
  dropwire-network:
    driver: bridge
